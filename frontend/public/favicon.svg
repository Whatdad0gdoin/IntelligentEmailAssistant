<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MailKit">
  <!-- The brand glyph from the sidebar and login hero: same rounded square,
       same blue gradient, same MK lettering, so the tab matches the app. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4FD8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- Heavy weight and tight tracking: at a 16px tab these letters are about
       7px tall, so anything lighter closes up into a smudge. -->
  <text x="32" y="33"
        text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1.5"
        fill="#ffffff">MK</text>
</svg>
